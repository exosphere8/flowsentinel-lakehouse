# Redpanda: a Kafka-compatible broker for the streaming path (`flowlake stream ...`).
#   docker compose up -d --wait                 broker on localhost:19092
#   docker compose --profile ui up -d --wait    plus Redpanda Console on http://localhost:8081
services:
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  console:
    image: redpandadata/console:v3.2.2
    profiles: ["ui"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  redpanda-data:

name: Release

# Push a tag like v0.2.0 (matching the version in pyproject.toml) to publish a release with
# the wheel, the source distribution and checksums. The notes come from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: The tag matches the package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      - name: Build the wheel and the source distribution
        run: uv build
      - name: Checksums
        run: cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Release notes from the changelog
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Publish
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          --verify-tag --title "FlowSentinel Lakehouse $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

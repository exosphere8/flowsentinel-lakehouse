name: Release

# Publishes a release with the wheel, the source distribution and checksums; the notes come
# from CHANGELOG.md. Either push a tag like v0.2.0 that matches the version in pyproject.toml,
# or run this workflow from the Actions tab: it releases the version in pyproject.toml from the
# chosen branch and creates the tag itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Decide the tag
        id: tag
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; bump the version in pyproject.toml first" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the wheel and the source distribution
        run: uv build
      - name: Checksums
        run: cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Release notes from the changelog
        run: scripts/release-notes.sh "${{ steps.tag.outputs.version }}" > notes.md
      - name: Publish
        run: >
          gh release create "${{ steps.tag.outputs.tag }}" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          --target "$GITHUB_SHA" --title "FlowSentinel Lakehouse ${{ steps.tag.outputs.tag }}"
          --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

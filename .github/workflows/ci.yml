name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # FlowSentinel commit whose output format this lakehouse is tested against.
  FLOWSENTINEL_REF: dfdb3cba20f031187bbc867124cd90af5f98a3db

jobs:
  lint:
    name: Lint, types and contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - name: JSON Schemas match the contract models
        run: uv run flowlake contract --check

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --locked
      - name: Unit, dbt and end-to-end tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  streaming:
    name: Streaming against Redpanda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - name: Start Redpanda
        run: docker compose up -d --wait
      - name: Kafka tests
        run: uv run pytest -m kafka tests/test_streaming.py
        env:
          FLOWLAKE_KAFKA_BOOTSTRAP: localhost:19092
      - name: Broker logs
        if: failure()
        run: docker compose logs redpanda

  upstream-contract:
    name: Contract against FlowSentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out FlowSentinel
        uses: actions/checkout@v5
        with:
          repository: exosphere8/flowsentinel
          ref: ${{ env.FLOWSENTINEL_REF }}
          path: flowsentinel
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flowsentinel
      - name: Build the flowsentinel CLI
        run: cargo build --release --locked -p cli --manifest-path flowsentinel/Cargo.toml
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - name: Every upstream flow satisfies the contract, field for field
        run: uv run pytest -m upstream tests/test_upstream.py
        env:
          FLOWSENTINEL_BIN: ${{ github.workspace }}/flowsentinel/target/release/flowsentinel
          FLOWSENTINEL_FIXTURES: ${{ github.workspace }}/flowsentinel/fixtures/pcap

  demo:
    name: Demo pipeline and detection scores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - name: Generate, ingest, build, score (fails below precision or recall 1.0)
        run: uv run flowlake demo --workers 4
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
